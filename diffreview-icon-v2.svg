<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6D5BFF"/>
      <stop offset="0.55" stop-color="#3A1FB8"/>
      <stop offset="1" stop-color="#160B4A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#FF4FD8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="glassBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A7A"/>
      <stop offset="1" stop-color="#FF8A5B"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EF2A0"/>
      <stop offset="1" stop-color="#8CFFC9"/>
    </linearGradient>
    <linearGradient id="orb" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E0FF"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4FD8"/>
      <stop offset="0.5" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0A0530" flood-opacity="0.45"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#0A0530" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- base -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glowA)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowB)"/>

    <!-- back glass panel ("before") -->
    <g transform="rotate(-9 420 520)" filter="url(#cardShadow)">
      <rect x="250" y="270" width="340" height="440" rx="64" fill="url(#glassBack)"/>
      <rect x="251.5" y="271.5" width="337" height="437" rx="62.5" fill="none" stroke="url(#glassRim)" stroke-opacity="0.6" stroke-width="3"/>
      <rect x="300" y="350" width="200" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.25"/>
      <rect x="300" y="410" width="240" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.25"/>
      <rect x="300" y="470" width="160" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.25"/>
    </g>

    <!-- front glass panel ("after") -->
    <g transform="rotate(5 560 520)">
      <g filter="url(#cardShadow)">
        <rect x="390" y="270" width="380" height="480" rx="70" fill="url(#glass)"/>
      </g>
      <rect x="391.5" y="271.5" width="377" height="477" rx="68.5" fill="none" stroke="url(#glassRim)" stroke-width="3"/>

      <!-- removed line -->
      <g filter="url(#glow)">
        <rect x="440" y="360" width="280" height="56" rx="28" fill="url(#red)"/>
      </g>
      <rect x="462" y="383" width="34" height="10" rx="5" fill="#FFFFFF"/>

      <!-- added lines -->
      <g filter="url(#glow)">
        <rect x="440" y="448" width="250" height="56" rx="28" fill="url(#green)"/>
        <rect x="440" y="536" width="190" height="56" rx="28" fill="url(#green)"/>
      </g>
      <rect x="462" y="471" width="34" height="10" rx="5" fill="#0E5A3A"/>
      <rect x="474" y="459" width="10" height="34" rx="5" fill="#0E5A3A"/>
      <rect x="462" y="559" width="34" height="10" rx="5" fill="#0E5A3A"/>
      <rect x="474" y="547" width="10" height="34" rx="5" fill="#0E5A3A"/>

      <!-- neutral line -->
      <rect x="440" y="630" width="140" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.45"/>
    </g>
  </g>

  <!-- feedback orb with AI sparkle -->
  <g filter="url(#cardShadow)">
    <circle cx="728" cy="726" r="104" fill="url(#orb)"/>
  </g>
  <circle cx="728" cy="726" r="102.5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <g transform="translate(728 726) scale(0.88) translate(-720 -718)"><path d="M720 640
           C728 690 748 710 798 718
           C748 726 728 746 720 796
           C712 746 692 726 642 718
           C692 710 712 690 720 640 Z" fill="url(#spark)"/>
  <path d="M790 650 C793 664 797 668 811 671 C797 674 793 678 790 692 C787 678 783 674 769 671 C783 668 787 664 790 650 Z" fill="url(#spark)"/></g>

  <!-- outer rim highlight -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
